[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hindsight"
version = "0.1.0"
description = "Audit trading-research repositories for lookahead, leakage and backtest bias."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Oscar Dalton" }]
keywords = ["backtest", "quant", "lookahead", "leakage", "static-analysis"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
# Only needed to *execute* the fixture repositories by hand. The auditor and the
# eval harness parse them with `ast` and never import them.
fixtures = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3"]
# Live model-backed passes. Static-only mode has no third-party requirement.
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/daltonoscar0/Auditing-Backtests-for-Leakage-and-Bias"
Repository = "https://github.com/daltonoscar0/Auditing-Backtests-for-Leakage-and-Bias"
Issues = "https://github.com/daltonoscar0/Auditing-Backtests-for-Leakage-and-Bias/issues"

[project.scripts]
hindsight = "hindsight.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hindsight"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Fixtures contain deliberately broken research code; they are audit input, not
# source, and are excluded from linting.
extend-exclude = ["fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["error"]
